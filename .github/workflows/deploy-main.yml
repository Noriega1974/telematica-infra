name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to ASG instances
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Obtener IPs de instancias del ASG
        id: get-ips   # <--- CORREGIDO: Ahora se llama get-ips para que coincida abajo
        run: |
          IPS=$(aws ec2 describe-instances \
            --filter "Name=tag:aws:autoscaling:groupName,Values=${{ secrets.ASG_NAME }}" \
            "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].PublicIpAddress' \
            --output text | paste -sd " " -)
          
          echo "instance_ips=$IPS" >> $GITHUB_OUTPUT
          echo "Instancias encontradas: $IPS"

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy a cada instancia
        run: |
          for IP in ${{ steps.get-ips.outputs.instance_ips }}; do
            echo "=== Deploying a $IP ==="
            ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ubuntu@$IP \
              "cd /app && git pull origin main && npm install --production && pm2 restart telematica-app --update-env && pm2 status"
            echo "=== Listo: $IP ==="
          done

      - name: Verificar deploy
        run: |
          sleep 15  # Le damos unos segundos más por cortesía para que conecte a la BD antes del test
          ALL_OK=true
          for IP in ${{ steps.get-ips.outputs.instance_ips }}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://$IP:3000/health)
            if [ "$STATUS" = "200" ]; then
              echo "ok $IP"
            else
              echo "fail $IP status $STATUS"
              ALL_OK=false
            fi
          done
          if [ "$ALL_OK" = "false" ]; then exit 1; fi